---
- name: Ensure SSH TCP Forwarding is permanently enabled on Bastion
  hosts: bastion
  become: yes
  tasks:
    - name: Force enable AllowTcpForwarding in sshd_config
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?AllowTcpForwarding'
        line: 'AllowTcpForwarding yes'
        state: present
    - name: Force enable AllowAgentForwarding in sshd_config
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?AllowAgentForwarding'
        line: 'AllowAgentForwarding yes'
        state: present
    - name: Restart SSH service to apply permanent forwarding rules
      systemd:
        name: ssh
        state: restarted

- name: Deploy Dynamic PHP Website with Hardware Stats on Debian 13
  hosts: webservers
  become: yes
  tasks:
    - name: Ustanovka Nginx i PHP-FPM dlya raboty dinamiki
      apt:
        name: [nginx, php-fpm]
        state: present
        update_cache: yes
    - name: Prinyaditelnoe udalenie starogo konfiga Nginx default
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
    - name: Zapiss novogo konfiga Nginx default s podderzhkoi PHP i Stub Status
      copy:
        dest: /etc/nginx/sites-available/default
        content: |
          server {
              listen 80 default_server;
              listen [::]:80 default_server;
              root /var/www/html;
              index index.php index.html index.htm;
              server_name _;
              location /stub_status {
                  stub_status on;
                  access_log off;
                  allow 127.0.0.1;
                  allow 10.0.0.0/8;
                  deny all;
              }
              location / {
                  try_files $uri $uri/ =404;
              }
              location ~ \.php$ {
                  include snippets/fastcgi-php.conf;
                  fastcgi_pass unix:/run/php/php8.4-fpm.sock;
              }
          }
        owner: root
        group: root
        mode: '0644'
    - name: Sozdanie simvolicheskoj ssylki dlya aktivacii sajta
      file:
        src: /etc/nginx/sites-available/default
        dest: /etc/nginx/sites-enabled/default
        state: link
    - name: Generaciya dinamicheskogo index.php faila s hardware dannymi
      copy:
        dest: /var/www/html/index.php
        content: |
          <!DOCTYPE html>
          <html lang="ru">
          <head>
              <meta charset="UTF-8">
              <title>Инфраструктура Enterprise.</title>
              <style>
                  body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f6f9; color: #333; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
                  .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; max-width: 600px; width: 100%; border-top: 8px solid #0052cc; margin: 20px; }
                  h1 { color: #0052cc; margin-bottom: 5px; font-size: 26px; }
                  .author { font-size: 18px; color: #555; font-weight: 600; margin-bottom: 25px; }
                  p { font-size: 15px; color: #666; line-height: 1.6; }
                  .status-box { background-color: #e3f2fd; border: 1px solid #90caf9; padding: 15px; border-radius: 8px; margin: 20px 0; font-size: 16px; color: #0d47a1; text-align: left; }
                  .status-line { margin: 8px 0; display: flex; justify-content: space-between; align-items: center; }
                  .badge { background: #4caf50; color: white; padding: 3px 10px; border-radius: 20px; font-size: 14px; font-weight: bold; }
                  .ip-text { font-family: 'Courier New', monospace; font-weight: bold; color: #333; }
                  .footer { margin-top: 30px; font-size: 12px; color: #aaa; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>Enterprise DevOps</h1>
                  <p>Infrastruktura rabotaet v Yandex Cloud.</p>
                  <div class="status-box">
                      <div class="status-line">Имя ноды: <span class="badge"><?php echo strtoupper('{{ inventory_hostname }}'); ?></span></div>
                      <div class="status-line">Внутренний IP: <span class="ip-text">{{ ansible_host }}</span></div>
                  </div>
                  <div class="footer">Infrastruktura kak kod (IaC) &copy; 2026</div>
              </div>
          </body>
          </html>
        owner: www-data
        group: www-data
        mode: '0644'
    - name: Prinyaditelnoe udalenie staroi  zaglushki index.html
      file:
        path: /var/www/html/index.html
        state: absent
    - name: Pervonachalnyi zapusk i avtozagruzka sluzhb veb-steka
      systemd:
        name: "{{ item }}"
        state: restarted
        enabled: yes
        daemon_reload: yes
      loop: [nginx, php8.4-fpm]