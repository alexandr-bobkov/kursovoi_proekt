[bastion]
bastion_host ansible_host=51.250.92.146 ansible_user=debian

[webservers]
web1 ansible_host=10.0.10.9 ansible_user=debian
web2 ansible_host=10.0.20.17 ansible_user=debian

[logging_storage]
elasticsearch_server ansible_host=10.0.10.27 ansible_user=debian

[prometheus_host]
prometheus_server ansible_host=10.0.10.19 ansible_user=debian

[public_mgmt]
grafana_kibana_server ansible_host=51.250.92.146 ansible_user=debian

[all:vars]
ansible_user=debian
ansible_ssh_private_key_file=/home/user/.ssh/id_rsa
ansible_ssh_common_args="-o StrictHostKeyChecking=no -o ProxyJump=debian@51.250.92.146"

# Жесткое отключение зацикливания для машин с белыми IP
[bastion:vars]
ansible_ssh_common_args="-o StrictHostKeyChecking=no"

[public_mgmt:vars]
ansible_ssh_common_args="-o StrictHostKeyChecking=no"
