---
- name: Configure Nginx PHP Processor for Debian 13
  hosts: webservers
  become: yes
  tasks:
    - name: Detect active PHP-FPM service name on system
      shell: "ls /run/php/php*-fpm.sock | head -n 1"
      register: php_socket_path

    - name: Enable PHP-FPM socket inside Nginx default config
      copy:
        dest: /etc/nginx/sites-available/default
        content: |
          server {
              listen 80 default_server;
              listen [::]:80 default_server;

              root /var/www/html;
              index index.php index.html index.htm;

              server_name _;

              location / {
                  try_files $uri $uri/ =404;
              }

              location ~ \.php$ {
                  include snippets/fastcgi-php.conf;
                  fastcgi_pass unix:{{ php_socket_path.stdout }};
              }
          }
        owner: root
        group: root
        mode: '0644'

    - name: Ensure PHP-FPM system daemon is active and running
      systemd:
        name: php8.3-fpm
        state: started
        enabled: yes
      ignore_errors: yes

    - name: Force systemd daemon-reload to refresh web stack
      systemd:
        daemon_reload: yes

    - name: Clean up static index remnants if any exist
      file:
        path: /var/www/html/index.html
        state: absent

    - name: Restart Nginx web server engine
      systemd:
        name: nginx
        state: restarted
