---
- name: Deploy Dynamic PHP Website with Hardware Stats on Debian 13
  hosts: webservers
  become: true
  tasks:
    - name: YA stavlyu veb-pakety i PHP-FPM dlya kursovoi
      apt:
        name:
          - nginx
          - php-fpm
          - php-cli
        state: present
        update_cache: yes

    - name: YA sozdayu chistuyu papku dlya koda sajta
      file:
        path: /var/web
        state: directory
        mode: '0755'

    - name: YA zapisyvayu krasivyi PHP kod s vyvodom zheleza
      copy:
        dest: /var/web/index.php
        mode: '0644'
        content: |
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="UTF-8">
              <title>DEVOPS Enterprise Stand - Bobkov</title>
              <style>
                  body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%); color: #333; text-align: center; padding: 60px 20px; margin: 0; min-height: 100vh; }
                  .card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); display: inline-block; max-width: 550px; width: 100%; border-top: 6px solid #00d2ff; }
                  .badge { background: #2b579a; color: white; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 14px; display: inline-block; margin-bottom: 10px; }
                  h1 { color: #1e3c72; margin-top: 5px; font-size: 26px; }
                  .student { font-size: 18px; color: #555; margin-bottom: 25px; font-weight: 600; border-bottom: 2px dashed #eee; padding-bottom: 15px; }
                  .status-box { background: #e8f5e9; border: 1px solid #c8e6c9; padding: 15px; border-radius: 8px; margin: 20px 0; }
                  .status { color: #2e7d32; font-weight: bold; font-size: 1.2em; margin: 0; }
                  .stats-table { width: 100%; border-collapse: collapse; margin-top: 20px; text-align: left; }
                  .stats-table th, .stats-table td { padding: 10px 12px; border-bottom: 1px solid #eee; font-size: 14px; }
                  .stats-table th { color: #666; font-weight: 600; width: 45%; }
                  .stats-table td { color: #111; font-family: monospace; font-weight: bold; }
              </style>
          </head>
          <body>
              <div class="card">
                  <div class="badge">DEVOPS ENTERPRISE</div>
                  <h1>Kursovoi Proekt: Enterprise Variant</h1>
                  <div class="student">Student: Bobkov A.K.</div>
                  <div class="status-box">
                      <p class="status">Aktivnyi server obrabotki: <?php echo gethostname(); ?></p>
                  </div>
                  <table class="stats-table">
                      <tr><th>Vnutrenniy IP-adres:</th><td><?php echo $_SERVER['SERVER_ADDR']; ?></td></tr>
                      <tr><th>Operacionnaya sistema:</th><td><?php echo php_uname('s') . " " . php_uname('r'); ?></td></tr>
                      <tr><th>Dostupnaya RAM:</th><td><?php echo round(shell_exec("free -m | awk '/Mem:/ {print $2}'")) . " MB"; ?></td></tr>
                      <tr><th>Kolichestvo yader CPU:</th><td><?php echo trim(shell_exec("nproc")); ?></td></tr>
                      <tr><th>Servernyi Uptime:</th><td><?php echo trim(shell_exec("uptime -p")); ?></td></tr>
                  </table>
              </div>
          </body>
          </html>

    - name: YA udalayu staruyu zaglushku index.html
      file:
        path: /var/web/index.html
        state: absent

    - name: YA nastraivayu virtualhost Nginx dlya PHP-FPM
      copy:
        dest: /etc/nginx/sites-available/default
        mode: '0644'
        content: |
          server {
              listen 80 default_server;
              server_name _;
              root /var/web;
              index index.php index.html;
              location / {
                  try_files $uri $uri/ =404;
              }
              location ~ \.php$ {
                  include snippets/fastcgi-php.conf;
                  fastcgi_pass unix:/run/php/php8.4-fpm.sock;
              }
          }

    - name: YA vklyuchayu i perezapuskayu veb-servisy
      service:
        name: "{{ item }}"
        state: restarted
        enabled: yes
      loop:
        - nginx
        - php8.4-fpm

- name: Deploy Elasticsearch Container s modulem xpack
  hosts: logging_storage
  become: true
  tasks:
    - name: YA stavlyu sam Docker i plagin compose dlya Debian 13
      apt:
        name:
          - docker.io
          - docker-compose
        state: present
        update_cache: yes

    - name: YA sozdayu direktoriyu dlya Elasticsearch
      file:
        path: /opt/elasticsearch
        state: directory
        mode: '0755'

    - name: YA zapisyvayu compose dlya elastika
      copy:
        dest: /opt/elasticsearch/docker-compose.yml
        mode: '0644'
        content: |
          version: '3.8'
          services:
            elasticsearch:
              image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
              container_name: elasticsearch-server
              environment:
                - discovery.type=single-node
                - ES_JAVA_OPTS=-Xms512m -Xmx512m
                - ELASTIC_PASSWORD=bobkov2026
                - xpack.security.enabled=false
              ports:
                - "9200:9200"
              volumes:
                - es_data:/usr/share/elasticsearch/data
          volumes:
            es_data:

    - name: YA podnimayu Elasticsearch v Docker
      shell: "docker-compose -f /opt/elasticsearch/docker-compose.yml up -d"
      ignore_errors: true

- name: Deploy Grafana i Kibana s krasivymi dashboardami
  hosts: public_mgmt
  become: true
  tasks:
    - name: YA stavlyu сам Docker и compose на Бастион для Grafana и Kibana
      apt:
        name:
          - docker.io
          - docker-compose
        state: present
        update_cache: yes

    - name: YA sozdayu papku dlya Grafana
      file:
        path: /opt/grafana
        state: directory
        mode: '0755'

    - name: YA zapisyvayu docker-compose dlya Grafana
      copy:
        dest: /opt/grafana/docker-compose.yml
        mode: '0644'
        content: |
          version: '3.8'
          services:
            grafana:
              image: grafana/grafana:10.0.3
              container_name: grafana-server
              ports:
                - "3000:3000"
              environment:
                - GF_SECURITY_ADMIN_PASSWORD=bobkov2026
              volumes:
                - grafana-storage:/var/lib/grafana
          volumes:
            grafana-storage:

    - name: YA podnimayu Grafana v Docker
      shell: "docker compose -f /opt/grafana/docker-compose.yml up -d"

    - name: YA sozdayu papku dlya Kibana
      file:
        path: /opt/kibana
        state: directory
        mode: '0755'

    - name: YA zapisyvayu docker-compose dlya Kibana
      copy:
        dest: /opt/kibana/docker-compose.yml
        mode: '0644'
        content: |
          version: '3.8'
          services:
            kibana:
              image: docker.elastic.co/kibana/kibana:7.17.10
              container_name: kibana-server
              ports:
                - "5601:5601"
              environment:
                - ELASTICSEARCH_HOSTS=http://10.100.20.33:9200
                - SERVER_NAME=kibana-bastion
              restart: always

    - name: YA podnimayu Kibana v Docker
      shell: "docker-compose -f /opt/kibana/docker-compose.yml up -d"

- name: Automatycheskaya ustanovka sborschyka metrik na VSE hosty
  hosts: all
  become: true
  tasks:
    - name: YA stavlyu agenta node-exporter dlya Grafana
      apt:
        name: prometheus-node-exporter
        state: present
        update_cache: yes

    - name: YA vklyuchayu i perezapuskayu sluzhbu eksporta metrik
      service:
        name: prometheus-node-exporter
        state: restarted
        enabled: yes
