---
# ==============================================================================
# 1. ДЕПЛОЙ СЕКЦИИ ХРАНЕНИЯ ЛОГОВ ELASTICSEARCH ПОД DEBIAN 13 (TRIXIE)
# ==============================================================================
- name: "Deploy Unified Elastic Stack v8.11.3"
  # Ставим Docker сразу на все три управляющие машины контура
  hosts: logging_storage:kibana_host:grafana_host
  become: true
  gather_facts: true
  vars:
    elastic_version: "8.11.3"
    stack_work_dir: "/opt/elastic-stack"

  tasks:
    # 1. ОТКАЗОУСТОЙЧИВАЯ УСТАНОВКА DOCKER ENGINE С АВТОПЕРЕКЛЮЧЕНИЕМ КЭША
    - name: "Install Native Docker Engine and Utilities"
      block:
        # Вариант А: Быстрый накат на уже прогретые после рестарта машины
        - name: "TRY: Install Docker packages without network cache update"
          ansible.builtin.apt:
            name:
              - docker.io
              - docker-buildx
              - docker-compose
              - python3-docker
            state: present
            update_cache: no

      rescue:
        # Вариант Б: Если это холодный старт после полного дестроя — обновляем кэш и ставим
        - name: "FALLBACK: Force update cache and install Docker for clean deployment"
          ansible.builtin.apt:
            name:
              - docker.io
              - docker-buildx
              - docker-compose
              - python3-docker
            state: present
            update_cache: yes


    # 2. ПОДГОТОВКА ДИРЕКТОРИЙ ОВНЕРСТВА СТЕКА (ТОЛЬКО НА ХОСТАХ ЛОГОВ/КИБАНЫ)
    - name: "Create Production Elastic Stack Directory"
      ansible.builtin.file:
        path: "{{ stack_work_dir }}"
        state: directory
        mode: "0755"
      when: inventory_hostname in groups['logging_storage'] or inventory_hostname in groups['kibana_host']

    # 3. УМНАЯ ЗАГРУЗКА ОБРАЗА С АВТОПЕРЕКЛЮЧЕНИЕМ ЗЕРКАЛА
    - name: "Pull Elastic Search Core Image with Fallback"
      block:
        # Вариант А: Пробуем быстро скачать через зеркало Яндекса
        - name: "TRY: Pull Elasticsearch from Yandex Cloud Mirror"
          community.docker.docker_image:
            name: "cr.yandex/mirror/elastic/elasticsearch:{{ elastic_version }}"
            source: pull

      rescue:
        # Вариант Б: Если Яндекс лежит или выдал 404, качаем напрямую с официального домена
        - name: "FALLBACK: Pull Elasticsearch from Official Elastic Registry"
          community.docker.docker_image:
            name: "docker.elastic.co/elasticsearch/elasticsearch:{{ elastic_version }}"
            source: pull
      when: inventory_hostname in groups['logging_storage']


    # 4. ГЕНЕРАЦИЯ ОДНОНОДОВОГО DOCKER-COMPOSE ДЛЯ СУБД ЛОГОВ
    - name: "Write Docker-Compose for Production Single-Node Cluster"
      ansible.builtin.copy:
        dest: "{{ stack_work_dir }}/docker-compose.yml"
        mode: "0644"
        content: |
          version: '3.8'
          services:
            elasticsearch:
              image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
              container_name: elasticsearch-node
              restart: always
              environment:
                - discovery.type=single-node
                - xpack.security.enabled=false
                - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
                - cluster.routing.allocation.disk.threshold_enabled=false
              ports:
                - "9200:9200"
              volumes:
                - esdata:/usr/share/elasticsearch/data
          volumes:
            esdata:
      when: inventory_hostname in groups['logging_storage']

    # 5. ЗАПУСК БАЗЫ ДАННЫХ ЛОГОВ
    - name: "Launch Production Single-Node Core Cluster"
      community.docker.docker_compose_v2:
        project_src: "{{ stack_work_dir }}"
        state: present
      when: inventory_hostname in groups['logging_storage']
