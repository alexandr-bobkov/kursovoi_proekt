---
- name: "Шаг 1: Установка Docker и базовых зависимостей на все узлы"
  hosts: internal
  become: true
  tasks:
    - name: "Удаление старого формата debian.sources (если есть)"
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/debian.sources
        state: absent

    - name: "Настройка зеркал Яндекса для APT (защита от таймаутов Debian)"
      ansible.builtin.copy:
        dest: /etc/apt/sources.list
        content: |
          deb http://mirror.yandex.ru/debian bookworm main contrib non-free non-free-firmware
          deb http://mirror.yandex.ru/debian-security bookworm-security main contrib non-free non-free-firmware
          deb http://mirror.yandex.ru/debian bookworm-updates main contrib non-free non-free-firmware
        mode: '0644'

    - name: "Установка системных пакетов"
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - python3-pip
          - python3-docker
          - docker.io
        state: present
        update_cache: yes

    - name: "Создание директории конфигурации Docker"
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        mode: '0755'

    - name: "Настройка зеркал Docker Hub (daemon.json)"
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: "{{ {'registry-mirrors': ['https://mirror.gcr.io', 'https://huecker.io']} | to_nice_json }}"
        mode: '0644'
      register: docker_mirror_config

    - name: "Проверка и запуск службы Docker"
      ansible.builtin.systemd:
        name: docker
        state: "{{ 'restarted' if docker_mirror_config.changed else 'started' }}"
        enabled: yes

    - name: "Развертывание Node Exporter на внутренних инстансах"
      community.docker.docker_container:
        name: node-exporter
        image: "prom/node-exporter:v1.6.1"
        restart_policy: always
        network_mode: host
        pid_mode: host
        volumes:
          - "/proc:/host/proc:ro"
          - "/sys:/host/sys:ro"
          - "/:/rootfs:ro"
        command:
          - "--path.procfs=/host/proc"
          - "--path.sysfs=/host/sys"
          - "--path.rootfs=/rootfs"

- name: "Развертывание Elasticsearch на хосте хранения логов"
  hosts: logging_storage
  become: true
  vars_files:
    - secrets.yml
  tasks:
    - name: "Установка параметров ядра vm.max_map_count для Elasticsearch"
      ansible.posix.sysctl:
        name: vm.max_map_count
        value: "262144"
        state: present
        reload: yes

    - name: "Создание директории данных Elasticsearch"
      ansible.builtin.file:
        path: /opt/elasticsearch/data
        state: directory
        mode: "0777"

    - name: "Запуск контейнера Elasticsearch"
      community.docker.docker_container:
        name: elasticsearch
        image: "docker.elastic.co/elasticsearch/elasticsearch:7.17.13"
        restart_policy: always
        network_mode: host
        env:
          discovery.type: "single-node"
          ES_JAVA_OPTS: "-Xms1g -Xmx1g"
          xpack.security.enabled: "false"
        volumes:
          - "/opt/elasticsearch/data:/usr/share/elasticsearch/data"

    - name: "Ожидание готовности API Elasticsearch (порт 9200)"
      ansible.builtin.wait_for:
        port: 9200
        timeout: 60