---
# ==============================================================================
# 3. ПОЛНЫЙ ДЕПЛОЙ ВЕБ-СТЕКА, ЭКСПОРТЕРОВ И АГЕНТОВ FILEBEAT НА ВЕБ-НОДАХ
# ==============================================================================
- name: "Deploy Production Web Nodes Stack"
  hosts: web_nodes:logging_storage:kibana_host:grafana_host
  become: true
  gather_facts: true
  vars:
    php_version: "8.4"
    web_work_dir: "/var/www/bobkov_site"
    elastic_version: "8.11.3"

  tasks:
    # 1. НАСТРОЙКА СЕТЕВОГО ОКРУЖЕНИЯ ДЛЯ РЕПОЗИТОРИЕВ ЯНДЕКСА
    - name: "Force APT to use IPv4 only to prevent network timeouts permanently"
      ansible.builtin.copy:
        dest: "/etc/apt/apt.conf.d/99force-ipv4"
        mode: "0644"
        content: |
          Acquire::ForceIPv4 "true";

    # 2. УСТАНОВКА ВЕБ-КОМПОНЕНТОВ (ВЫПОЛНЯЕТСЯ СТРОГО НА ВЕБ-НОДАХ БЭКЕНДА)
    - name: "Install Production Web Server and PHP Processing Engine"
      ansible.builtin.apt:
        name:
          - nginx
          - php8.4-fpm
          - php8.4-curl
          - php8.4-gd
          - php8.4-intl
          - php8.4-mbstring
          - php8.4-xml
        state: present
        update_cache: yes
      when: inventory_hostname in groups['web_nodes']

    - name: "Create Production Directory for Bobkov site"
      ansible.builtin.file:
        path: "{{ web_work_dir }}"
        state: directory
        mode: "0755"
        owner: "www-data"
        group: "www-data"
      when: inventory_hostname in groups['web_nodes']

    - name: "Deploy Neo-Style Custom site Page"
      ansible.builtin.copy:
        dest: "{{ web_work_dir }}/index.php"
        mode: "0644"
        owner: "www-data"
        group: "www-data"
        content: |
          <?php
          header("Content-Type: text/html; charset=utf-8");
          $hostname = gethostname();
          $server_ip = $_SERVER['SERVER_ADDR'];
          ?>
          <!DOCTYPE html>
          <html>
          <head>
              <title>DevOps Enterprise Контур Бобкова А.К.</title>
              <style>
                  body { background: #0a0a12; color: #00ffcc; font-family: 'Courier New', monospace; text-align: center; padding-top: 10%; }
                  .container { border: 2px solid #ff007f; display: inline-block; padding: 30px; box-shadow: 0 0 20px #ff007f; background: #11111e; }
                  h1 { color: #ff007f; text-shadow: 0 0 10px #ff007f; }
                  .info { color: #00ffcc; font-size: 1.2em; margin: 15px 0; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>ИНФРАСТРУКТУРА РАЗВЕРНУТА УСПЕШНО</h1>
                  <div class="info">Курсовой проект студент: <strong>Бобков А.К.</strong></div>
                  <div class="info">Целевой Enterprise-вариант с балансировщиком ALB</div>
                  <div class="info">Текущий бэкенд-хост обработки: <code><?php echo $hostname; ?> (<?php echo $server_ip; ?>)</code></div>
              </div>
          </body>
          </html>
      when: inventory_hostname in groups['web_nodes']

    - name: "Configure Production Nginx Virtual Host Configuration"
      ansible.builtin.copy:
        dest: "/etc/nginx/sites-available/default"
        mode: "0644"
        content: |
          server {
              listen 80 default_server;
              listen [::]:80 default_server;
              root /var/www/bobkov_site;
              index index.php index.html;
              server_name _;

              # ВШИТЫЙ БЛОК ТЕЛЕМЕТРИИ ДЛЯ ОЖИВЛЕНИЯ NGINX EXPORTER
              location /stub_status {
                  stub_status on;
                  allow 127.0.0.1;
                  deny all;
              }

              location / {
                  try_files $uri $uri/ =404;
              }
              location ~ \.php$ {
                  include snippets/fastcgi-php.conf;
                  fastcgi_pass unix:/run/php/php8.4-fpm.sock;
              }
          }
      when: inventory_hostname in groups['web_nodes']


    - name: "Enforce and restart Nginx & PHP services"
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: restarted
        enabled: true
      loop:
        - php8.4-fpm
        - nginx
      when: inventory_hostname in groups['web_nodes']

    # 3. УСТАНОВКА СИСТЕМНОГО ЭКСПОРТЕРА ЖЕЛЕЗА (НА ВСЕХ УПРАВЛЯЮЩИХ СЕРВЕРАХ)
    - name: "Install Native Prometheus Node Exporter Package via apt"
      ansible.builtin.apt:
        name: prometheus-node-exporter
        state: present
      when: inventory_hostname not in groups['web_nodes']

    # 4. ОРКЕСТРАЦИЯ КОНТЕЙНЕРОВ СБОРА МЕТРИК НА ВЕБ-НОДАХ
    - name: "Launch Node Exporter Container on Web Nodes"
      community.docker.docker_container:
        name: "node-exporter"
        image: "prom/node-exporter:v1.6.1"
        state: started
        restart_policy: always
        ports:
          - "9100:9100"
      when: inventory_hostname in groups['web_nodes']

    # ==============================================================================
    # 5. ОРКЕСТРАЦИЯ СБОРА МЕТРИК ВЕБ-СЕРВЕРА NGINX
    # ==============================================================================
    - name: "Launch Nginx Prometheus Exporter Container"
      community.docker.docker_container:
        name: "nginx-exporter"
        image: "nginx/nginx-prometheus-exporter:1.0.0"
        state: started
        restart_policy: always
        network_mode: host # ДОБАВЛЕНО: Открывает контейнеру прямую сеть до хоста
        command: "-nginx.scrape-uri=http://127.0.0.1:80/stub_status" # ИСПРАВЛЕНО: Точный снайперский путь к метрикам!
      when: inventory_hostname in groups['web_nodes']


    # 6. Enterprise-БЛОК ЛОГИРОВАНИЯ: РАЗВЕРТЫВАНИЕ AGENT FILEBEAT
    - name: "Create Production Filebeat Home Directory"
      ansible.builtin.file:
        path: "/opt/filebeat-agent"
        state: directory
        mode: "0755"
      when: inventory_hostname in groups['web_nodes']

    - name: "Generate Valid Configuration Profile for Filebeat Agent"
      ansible.builtin.copy:
        dest: "/opt/filebeat-agent/filebeat.yml"
        mode: "0644"
        content: |
          filebeat.inputs:
          - type: log
            enabled: true
            paths:
              - /var/log/nginx/access.log
              - /var/log/nginx/error.log
          output.elasticsearch:
            hosts: ["http://10.100.20.26:9200"] # Снайперски точный IP твоего Эластика
          logging.level: info
      when: inventory_hostname in groups['web_nodes']

    - name: "Launch Universal Filebeat Infrastructure Agent on Web Nodes"
      community.docker.docker_container:
        name: "filebeat-web"
        image: "docker.elastic.co/beats/filebeat:{{ elastic_version }}"
        state: started
        restart_policy: always
        user: "root"
        volumes:
          - /opt/filebeat-agent/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
          - /var/log/nginx:/var/log/nginx:ro
          - /var/lib/docker/containers:/var/lib/docker/containers:ro
      when: inventory_hostname in groups['web_nodes']
