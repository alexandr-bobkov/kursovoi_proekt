---
- name: "Шаг 3: Настройка веб-узлов кластера"
  hosts: web_nodes
  become: true
  tasks:
    - name: "Установка веб-сервера Nginx"
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: yes

    - name: "Установка Filebeat 7.17.13 (напрямую .deb пакетом с зеркала Яндекса)"
      ansible.builtin.apt:
        deb: "https://mirror.yandex.ru/mirrors/elastic/7/pool/main/f/filebeat/filebeat-7.17.13-amd64.deb"
        state: present

    # =========================================================================
    # ДИНАМИЧЕСКИЙ ГЕНЕРАТОР ВЕБ-САЙТА (Bash + Systemd) - БЕЗ ЭМОДЗИ
    # =========================================================================
    - name: "Создать скрипт динамического обновления сайта"
      ansible.builtin.copy:
        dest: /usr/local/bin/update_site.sh
        mode: "0755"
        content: |
          #!/bin/bash
          while true; do
              HOSTNAME=$(hostname)
              IP=$(hostname -I | awk '{print $1}')
              CPU_LOAD=$(cat /proc/loadavg | awk '{print $1, $2, $3}')
              RAM_TOTAL=$(free -m | awk '/^Mem:/{print $2}')
              RAM_USED=$(free -m | awk '/^Mem:/{print $3}')
              UPTIME=$(uptime -p | sed 's/up //')

              cat <<EOF > /var/www/html/index.html
              <!DOCTYPE html>
              <html lang="ru">
              <head>
                  <meta charset="UTF-8">
                  <meta name="viewport" content="width=device-width, initial-scale=1.0">
                  <title>Enterprise Cluster</title>
                  <meta http-equiv="refresh" content="3">
                  <style>
                      body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #FF9A9E 0%, #FECFEF 99%, #FECFEF 100%); color: #333; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
                      .container { background: rgba(255, 255, 255, 0.6); padding: 40px; border-radius: 20px; box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.8); text-align: center; max-width: 600px; }
                      h1 { font-size: 2.2em; color: #2c3e50; margin-bottom: 20px; }
                      .stat-box { background: rgba(255, 255, 255, 0.8); margin: 12px 0; padding: 15px; border-radius: 12px; font-size: 1.2em; font-weight: bold; transition: transform 0.2s; display: flex; align-items: center; justify-content: left; }
                      .stat-box:hover { transform: scale(1.02); }
                      .footer { margin-top: 25px; font-size: 0.9em; color: #666; }
                  </style>
              </head>
              <body>
                  <div class="container">
                      <h1>Добро пожаловать в Enterprise Облако!</h1>
                      <p>Ваш запрос успешно обработан балансировщиком Yandex ALB.</p>
                      
                      <div class="stat-box">Node:&nbsp;<span style="color:#e74c3c;">${HOSTNAME}</span></div>
                      <div class="stat-box">IP:&nbsp;<span style="color:#2980b9;">${IP}</span></div>
                      <div class="stat-box">CPU:&nbsp;<span style="color:#d35400;">${CPU_LOAD}</span></div>
                      <div class="stat-box">RAM:&nbsp;<span style="color:#8e44ad;">${RAM_USED} MB / ${RAM_TOTAL} MB</span></div>
                      <div class="stat-box">Uptime:&nbsp;<span style="color:#27ae60;">${UPTIME}</span></div>
                      
                      <div class="footer">Страница обновляется сама каждые 3 секунды.</div>
                  </div>
              </body>
              </html>
          EOF
              sleep 3
          done

    - name: "Создать systemd службу для генератора сайта"
      ansible.builtin.copy:
        dest: /etc/systemd/system/dynamic-website.service
        content: |
          [Unit]
          Description=Dynamic Enterprise Website Generator
          After=network.target nginx.service

          [Service]
          Type=simple
          User=root
          ExecStart=/usr/local/bin/update_site.sh
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=multi-user.target

    - name: "Перезагрузить systemd и запустить службу"
      ansible.builtin.systemd:
        daemon_reload: yes
        name: dynamic-website
        state: restarted
        enabled: yes
    # =========================================================================

    - name: "Настройка Nginx Stub Status для экспортёра"
      ansible.builtin.copy:
        dest: /etc/nginx/conf.d/status.conf
        content: |
          server {
              listen 127.0.0.1:8080;
              server_name localhost;
              location /stub_status {
                  stub_status on;
                  access_log off;
                  allow 127.0.0.1;
                  deny all;
              }
          }
        mode: "0644"
      notify: Перезагрузить Nginx

    - name: "Запуск службы Nginx"
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: yes

    - name: "Запуск Nginx Prometheus Exporter"
      community.docker.docker_container:
        name: nginx-exporter
        image: "nginx/nginx-prometheus-exporter:0.11.0"
        restart_policy: always
        network_mode: host
        command:
          - "-nginx.scrape-uri=http://127.0.0.1:8080/stub_status"

    # =========================================================================
    # ОБНОВЛЕННЫЙ FILEBEAT (МЕТАДАННЫЕ DOCKER ДОБАВЛЕНЫ)
    # =========================================================================
    - name: "Настройка агента Filebeat"
      ansible.builtin.copy:
        dest: /etc/filebeat/filebeat.yml
        content: |
          filebeat.inputs:
          - type: log
            enabled: true
            paths:
              - /var/log/nginx/*.log

          - type: container
            enabled: true
            paths:
              - '/var/lib/docker/containers/*/*.log'

          processors:
            - add_docker_metadata:
                host: "unix:///var/run/docker.sock"

          output.elasticsearch:
            hosts: ["{{ hostvars[groups['logging_storage'] | first]['ansible_host'] }}:9200"]
        mode: "0644"
      notify: Перезапустить Filebeat

    - name: "Запуск и включение автозапуска Filebeat"
      ansible.builtin.systemd:
        name: filebeat
        state: started
        enabled: yes

  handlers:
    - name: Перезагрузить Nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded

    - name: Перезапустить Filebeat
      ansible.builtin.systemd:
        name: filebeat
        state: restarted