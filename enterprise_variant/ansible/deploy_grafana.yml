---
- name: Deploy Grafana s krasivymi dashboardami
  hosts: public_mgmt
  become: true
  tasks:
    - name: YA sozdayu papku dlya Grafana
      file:
        path: /opt/grafana
        state: directory
        mode: '0755'

    - name: YA zapisyvayu docker-compose dlya Grafana
      copy:
        dest: /opt/grafana/docker-compose.yml
        mode: '0644'
        content: |
          version: '3.8'
          services:
            grafana:
              image: grafana/grafana:10.0.3
              container_name: grafana-server
              ports:
                - "3000:3000"
              environment:
                - GF_SECURITY_ADMIN_PASSWORD=admin
              volumes:
                - grafana-storage:/var/lib/grafana
          volumes:
            grafana-storage:

    - name: YA podnimayu Grafana v Docker
      shell: "docker compose -f /opt/grafana/docker-compose.yml up -d"

    - name: YA zashishau i podgotavlivayu minimalnyi shablon dashboarda
      copy:
        dest: /tmp/node-exporter-full.json
        mode: '0644'
        content: |
          {
            "annotations": { "list": [] },
            "editable": true,
            "fiscalYearStartMonth": 0,
            "graphTooltip": 0,
            "id": null,
            "links": [],
            "liveNow": false,
            "panels": [
              {
                "type": "timeseries",
                "title": "CPU Utilization",
                "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
                "id": 1,
                "targets": [
                  { "expr": "100 - (avg by (instance) (irate(node_cpu_seconds_total{mode='idle'}[5m])) * 100)", "refId": "A" }
                ]
              }
            ],
            "refresh": "5s",
            "schemaVersion": 38,
            "style": "dark",
            "tags": [],
            "time": { "from": "now-1h", "to": "now" },
            "timepicker": {},
            "timezone": "",
            "title": "Node Exporter Dashboard Enterprise",
            "uid": "node-exporter-ent",
            "version": 1,
            "weekStart": ""
          }
