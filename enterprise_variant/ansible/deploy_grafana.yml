    # ==============================================================================
    # 5. НА ТИВНЫЙ SYSTEMD СЕРВИС АДАПТЕРА (БЕЗ DOCKER BUILD И ПУСТЫХ ПЕРЕМЕННЫХ)
    # ==============================================================================
    - name: "Create Production Directory for Adapter Binary"
      ansible.builtin.file:
        path: "/opt/adapter"
        state: directory
        mode: "0755"

    - name: "Deliver Pre-built Adapter Binary to Target Host"
      ansible.builtin.copy:
        src: "files/pg-adapter"
        dest: "/opt/adapter/pg-adapter"
        mode: "0755"

    - name: "Configure and Deploy systemd Service Unit for Adapter"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/pg-prometheus-adapter.service"
        mode: "0644"
        content: |
          [Unit]
          Description=PostgreSQL Prometheus Adapter (Remote Write Sink)
          After=network.target

          [Service]
          Type=simple
          # Исправлено: Собираем гарантированные дефолты CrunchyData, не зависящие от стирания памяти Ansible
          Environment="DATABASE_URL=postgresql://crunchy_admin:BobkovDevOps2026@{{ postgres_target_ip }}:5432/postgres?sslmode=disable"
          # Исправлено: Используем верный внутренний флаг порта адаптера --port
          ExecStart=/opt/adapter/pg-adapter --port=9201
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target

    - name: "Enforce and Start Systemd Adapter Service"
      ansible.builtin.systemd:
        name: pg-prometheus-adapter
        daemon_reload: yes
        enabled: yes
        state: restarted

    # ==============================================================================
    # 6. ОРКЕСТРАЦИЯ ОСТАЛЬНЫХ СЕРВИСОВ МОНИТОРИНГА
    # ==============================================================================
    - name: "Fix Permissions for Prometheus and Grafana Directories"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0777" # Исправлено: Выдаем полные права, чтобы контейнеры не зависали на диске!
      loop:
        - "{{ p_dir }}/data"
        - "{{ g_dir }}/provisioning"

    - name: "Pull Prometheus image"
      community.docker.docker_image:
        name: "mirror.gcr.io/prom/prometheus:v2.45.0"
        source: pull
        state: present

    - name: "Launch Prometheus Container"
      community.docker.docker_container:
        name: prometheus-server
        image: "mirror.gcr.io/prom/prometheus:v2.45.0"
        restart_policy: always
        network_mode: host # Исправлено: Даем прямую сеть до хоста к порту 9201
        volumes:
          - "{{ p_dir }}/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
          - "{{ p_dir }}/targets.json:/etc/prometheus/targets.json:ro"
          - "{{ p_dir }}/targets_nginx.json:/etc/prometheus/targets_nginx.json:ro"
          - "{{ p_dir }}/data:/prometheus"
        command:
          - "--config.file=/etc/prometheus/prometheus.yml"
          - "--storage.tsdb.path=/prometheus"
          - "--web.enable-lifecycle"

    - name: "Pull Grafana Enterprise image"
      community.docker.docker_image:
        name: "mirror.gcr.io/grafana/grafana-enterprise:10.2.3"
        source: pull
        state: present

    - name: "Launch Grafana Container"
      community.docker.docker_container:
        name: grafana-server
        image: "mirror.gcr.io/grafana/grafana-enterprise:10.2.3"
        restart_policy: always
        network_mode: host
        user: "472"
        env:
          GF_SECURITY_ADMIN_PASSWORD: "{{ grafana_admin_password | default('BobkovDevOps2026') }}"
          GF_PATHS_PROVISIONING: "/etc/grafana/provisioning"
        volumes:
          - "{{ g_dir }}/provisioning:/etc/grafana/provisioning"

    - name: "Wait for Core Engine Network Sockets Readiness"
      ansible.builtin.wait_for:
        port: "{{ item }}"
        timeout: 45
      loop:
        - 9090
        - 3000
